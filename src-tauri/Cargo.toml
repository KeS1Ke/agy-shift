[package]
name = "agy-shift"
version = "0.1.6"
description = "Agy Shift - 简洁专注的 Antigravity 账号切换工具"
authors = ["KeS1Ke", "jlcodes"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"

[lib]
name = "agy_shift_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json = "1"
json-patch = "3"

[dev-dependencies]
axum = "0.8"

[dependencies]
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
iana-time-zone = "0.1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "blocking", "multipart", "rustls-tls-native-roots"] }
# 为 tauri-plugin-updater 所依赖的 reqwest 0.13 合并 socks 特性，使更新请求支持 socks5 代理
reqwest_updater_socks = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.13"
ring = "0.17"
thiserror = "2"
anyhow = "1.0"
sha2 = "0.10"
fs2 = "0.4"
serde_urlencoded = "0.7"
url = "2.5"
regex = "1"
rand = "0.8"
futures = "0.3"
sysinfo = "0.33"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
md5 = "0.7"
tiny_http = "0.12"
urlencoding = "2.1"
lazy_static = "1.5"
trash = "5"
aes-gcm = "0.10"
keyring = { version = "3.6", features = ["windows-native"] }
socket2 = "0.6"
junction.workspace = true
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
